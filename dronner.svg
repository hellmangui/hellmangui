<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="Dronner — a red dragon jumping a stone and burning a husk">
  <style>
    .sky   { fill: #0d1117; }
    .ridge { fill: #1d2733; }
    .hill  { fill: #243040; }
    .floor { fill: #161c25; }
    .line  { stroke: #8b8677; stroke-width: 2; }
    .scale { fill: #b8342a; }
    .belly { fill: #e2a05c; }
    .wingA { fill: #7d2119; }
    .wingB { fill: #9c2b21; }
    .eye   { fill: #f0913f; }
    .stone { fill: #3a4a5e; stroke: #8b8677; stroke-width: 2; }
    .husk  { fill: #5c2f26; }
    .tick  { stroke: #8b8677; stroke-width: 3; opacity: .38; }
    .flame { fill: #f0913f; }

    /* Google Fonts cannot load inside an SVG on GitHub, so these ride on
       generic families that resolve everywhere. */
    .hud  { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
            font-size: 21px; font-weight: 600; fill: #d9d3c5; text-anchor: end; }
    .hud.dim { font-size: 13px; font-weight: 400; fill: #8b8677; }
    .mark { font-family: Impact, "Arial Black", sans-serif; font-size: 27px;
            letter-spacing: 3px; fill: #d9d3c5; }
    .cue  { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
            font-size: 13px; letter-spacing: 3px; fill: #d2691e; }

    /* One 6s run, choreographed: the stone arrives at 2.45s, the husk at 4.7s. */
    .obstacles { animation: sweep 6s linear infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(-1200px); } }

    .ticks { animation: ticks 1.1s linear infinite; }
    @keyframes ticks { to { transform: translateX(-215px); } }

    .hop { animation: hop 6s linear infinite; }
    @keyframes hop {
      0%, 34%   { transform: translateY(0); }
      38%       { transform: translateY(-42px); }
      41%       { transform: translateY(-58px); }
      44%       { transform: translateY(-42px); }
      48%, 100% { transform: translateY(0); }
    }

    .rider { animation: bob .42s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

    .wing-near { transform-origin: 214px 96px; animation: flap .42s ease-in-out infinite alternate; }
    .wing-far  { transform-origin: 210px 100px; animation: flap .42s ease-in-out infinite alternate reverse; }
    @keyframes flap { from { transform: rotate(-16deg); } to { transform: rotate(20deg); } }

    .legA { transform-origin: 218px 128px; animation: step .42s ease-in-out infinite alternate; }
    .legB { transform-origin: 204px 128px; animation: step .42s ease-in-out infinite alternate reverse; }
    @keyframes step { from { transform: rotate(-24deg); } to { transform: rotate(26deg); } }

    /* fire fires only as the husk arrives */
    .fire { transform-origin: 268px 78px; animation: breath 6s linear infinite; }
    @keyframes breath {
      0%, 73%   { transform: scaleX(0); opacity: 0; }
      76%       { transform: scaleX(1); opacity: 1; }
      81%       { transform: scaleX(1.06); opacity: 1; }
      84%, 100% { transform: scaleX(0); opacity: 0; }
    }

    /* the husk goes out right after it is hit */
    .burnt { animation: burnt 6s linear infinite; }
    @keyframes burnt {
      0%, 77%  { opacity: 1; }
      83%      { opacity: .16; }
      100%     { opacity: .16; }
    }

    @media (prefers-reduced-motion: reduce) {
      .obstacles, .ticks, .hop, .rider, .wing-near, .wing-far,
      .legA, .legB, .fire, .burnt { animation: none; }
      .fire { transform: scaleX(1); opacity: 1; }
    }
  </style>

  <rect class="sky" width="860" height="200"/>
  <clipPath id="screen"><rect x="1" y="1" width="858" height="198"/></clipPath>

  <g clip-path="url(#screen)">
    <path class="ridge" d="M0 122 L90 88 L170 112 L260 78 L350 108 L440 84 L530 114 L620 90 L710 110 L800 86 L860 106 L860 200 L0 200 Z"/>
    <path class="hill" d="M0 140 L120 118 L230 138 L340 116 L450 140 L560 120 L670 142 L780 118 L860 136 L860 200 L0 200 Z"/>
    <rect class="floor" y="150" width="860" height="50"/>
    <line class="line" x1="0" y1="150" x2="860" y2="150"/>

    <g class="ticks">
      <g class="tick">
        <line x1="20"  y1="168" x2="58"  y2="168"/><line x1="105" y1="168" x2="143" y2="168"/>
        <line x1="190" y1="168" x2="228" y2="168"/><line x1="275" y1="168" x2="313" y2="168"/>
        <line x1="360" y1="168" x2="398" y2="168"/><line x1="445" y1="168" x2="483" y2="168"/>
        <line x1="530" y1="168" x2="568" y2="168"/><line x1="615" y1="168" x2="653" y2="168"/>
        <line x1="700" y1="168" x2="738" y2="168"/><line x1="785" y1="168" x2="823" y2="168"/>
        <line x1="870" y1="168" x2="908" y2="168"/><line x1="955" y1="168" x2="993" y2="168"/>
      </g>
    </g>

    <g class="obstacles">
      <path class="stone" d="M690 150 L700 116 L734 122 L744 150 Z"/>
      <g class="burnt">
        <path class="husk" d="M1176 62 L1206 96 L1194 150 L1158 150 L1146 96 Z"/>
        <circle class="eye" cx="1166" cy="92" r="4"/>
        <circle class="eye" cx="1186" cy="92" r="4"/>
      </g>
    </g>

    <g class="hop">
      <g class="rider">
        <path class="scale" d="M186 108 Q150 112 128 92 Q152 118 184 118 Z"/>

        <g class="wing-far">
          <path class="wingA" d="M210 100 L166 68 L182 104 L172 126 Z"/>
        </g>

        <g class="legA"><rect class="scale" x="213" y="126" width="10" height="26" rx="5"/></g>
        <g class="legB"><rect class="scale" x="199" y="126" width="10" height="26" rx="5"/></g>

        <ellipse class="scale" cx="208" cy="108" rx="32" ry="25" transform="rotate(-7 208 108)"/>
        <ellipse class="belly" cx="210" cy="116" rx="21" ry="13" transform="rotate(-7 210 116)"/>

        <path class="scale" d="M226 96 Q244 74 254 66 L268 74 Q250 92 240 108 Z"/>
        <ellipse class="scale" cx="250" cy="72" rx="20" ry="16" transform="rotate(10 250 72)"/>
        <path class="scale" d="M262 66 L286 74 L262 82 Z"/>
        <path class="scale" d="M242 58 L234 38 L252 56 Z"/>
        <circle class="eye" cx="257" cy="68" r="3.6"/>

        <g class="wing-near">
          <path class="wingB" d="M214 96 L164 58 L180 98 L170 122 Z"/>
        </g>

        <g class="fire">
          <path class="flame" d="M283 66 Q312 58 336 64 Q322 70 344 71 Q328 76 352 76 Q326 84 300 84 L283 81 Q294 74 283 66 Z" opacity=".95"/>
          <path class="flame" d="M287 70 Q310 65 328 71 Q308 79 287 78 Z" fill="#ffd682"/>
        </g>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="858" height="198" fill="none" stroke="#d9d3c5" stroke-opacity=".14" stroke-width="2"/>
  <text class="hud" x="826" y="40">00107</text>
  <text class="hud dim" x="826" y="62">BEST 00107</text>
  <text class="mark" x="34" y="44">DRONNER</text>
  <text class="cue" x="34" y="68">▸ PLAY</text>
</svg>
