    <text x="18" y="62" class="label">PUBLIC REPOS</text>
  </g>
<g transform="translate(248 58)">
    <rect width="184" height="86" rx="8" fill="#161b1f" stroke="#30363d"/>
    <text x="18" y="34" class="value">5</text>
    <text x="18" y="62" class="label">MERGED PRS</text>
  </g>
<g transform="translate(456 58)">
    <rect width="184" height="86" rx="8" fill="#161b1f" stroke="#30363d"/>
    <text x="18" y="34" class="value">1</text>
    <text x="18" y="62" class="label">FOLLOWERS</text>
  </g>
<g transform="translate(664 58)">
    <rect width="184" height="86" rx="8" fill="#161b1f" stroke="#30363d"/>
    <text x="18" y="34" class="value">0</text>
    <text x="18" y="62" class="label">STARS</text>
  </g>
  <path d="M40 160H860" stroke="#252b2f"/>
  <path d="M40 160H330" stroke="#8e2f2b" stroke-width="2"/>
